# CampusHub Sync — Nginx server block for schedule.nzlab.online
#
# Install (Debian/Ubuntu):
#   sudo cp deploy/nginx/schedule.nzlab.online.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/schedule.nzlab.online.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: obtain the certificate first, then reload Nginx.
#   sudo certbot --nginx -d schedule.nzlab.online
#
# The backend listens on 127.0.0.1:8000 (docker-compose publishes it on loopback
# only), so no direct :8000 rule is needed in the firewall.

upstream campushub_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ---- HTTP: ACME challenges + permanent redirect to HTTPS -------------------
server {
    listen 80;
    listen [::]:80;
    server_name schedule.nzlab.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name schedule.nzlab.online;

    ssl_certificate     /etc/letsencrypt/live/schedule.nzlab.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schedule.nzlab.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # security headers — the PWA needs none of the frame privileges
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "no-referrer" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ICS uploads (timetable fallback) are capped at 2 MB by the API
    client_max_body_size 5m;

    access_log /var/log/nginx/campushub.access.log;
    error_log  /var/log/nginx/campushub.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml text/calendar;

    # ------------------------------------------------------------ iCal feed
    # Calendar clients poll this URL; never let anything cache it except the
    # client itself (the API already emits a strong ETag).
    location = /api/subscribe/calendar.ics {
        add_header Cache-Control "private, max-age=0, must-revalidate" always;
        proxy_pass http://campushub_backend;
        include /etc/nginx/proxy_params_schedule;  # or the snippet below
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------- the API
    location /api/ {
        proxy_pass http://campushub_backend;
        proxy_http_version 1.1;
        # WebSocket / SSE ready (APScheduler-driven streaming endpoints, if any)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # ------------------------------------------------------- service worker
    # Must always be revalidated, otherwise clients pin an old SW forever.
    location = /sw.js {
        proxy_pass http://campushub_backend;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        proxy_pass http://campushub_backend;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ------------------------------------------------------ hashed assets
    # Vite emits content-hashed filenames under /assets → safe to cache hard.
    location /assets/ {
        proxy_pass http://campushub_backend;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        proxy_pass http://campushub_backend;
        add_header Cache-Control "no-cache" always;
    }

    # ------------------------------------------------------------- app shell
    location / {
        proxy_pass http://campushub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# Needed once, in the http {} block of /etc/nginx/nginx.conf (Nginx >= 1.25
# accepts `http2 on;` above; the map below enables WebSocket upgrades):
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# If you keep a global proxy_params file instead of the inline headers above,
# make sure it does NOT override Cache-Control for /api/subscribe/calendar.ics.
