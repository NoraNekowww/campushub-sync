# CampusHub Sync — nginx snippet for a sub-path deployment
#
# The production box (laserver01-nz) already serves one `default` server block on
# 443 with `/var/www/<project>/` folders, and 127.0.0.1:8000 is taken by the
# cycle backend. So the schedule app lives on 127.0.0.1:8010 behind
# https://nzlab.online/schedule/ and these four locations drop into the existing
# server block (right after the existing `location /api/ { … }`).
#
#   include /etc/nginx/snippets/campushub-sync.conf;
#
# Why the paths look odd:
#   * `/schedule/api/` strips the `/schedule` prefix (`proxy_pass ... /api/`),
#     so the FastAPI app keeps its plain `/api/...` routes and stays runnable
#     standalone on localhost for development.
#   * the static side is an `alias`, not a `root`, because the built bundle is
#     already prefixed with `/schedule/` (built with VITE_BASE=/schedule/).
#   * `sw.js` must never be cached, or a PWA update would never land.

location ^~ /schedule/api/ {
    proxy_pass http://127.0.0.1:8010/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
}

location = /schedule/sw.js {
    alias /var/www/schedule/frontend/sw.js;
    add_header Cache-Control "no-cache, must-revalidate" always;
    types { } default_type application/javascript;
}

location = /schedule/manifest.webmanifest {
    alias /var/www/schedule/frontend/manifest.webmanifest;
    add_header Cache-Control "no-cache" always;
    default_type application/manifest+json;
}

location /schedule/ {
    alias /var/www/schedule/frontend/;
    index index.html;
    try_files $uri $uri/ /schedule/index.html;
    # 页面骨架（index.html）必须每次回源校验。否则客户端会拿着旧 index.html
    # 去引用已经被替换掉的旧 bundle：界面照常能用，新功能却永远不出现
    # —— 2026-10-10「注册页看不到图形验证码」就是这么来的。
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# 产物文件名带内容 hash，改了就换名，可以放心长期缓存。
location ^~ /schedule/assets/ {
    alias /var/www/schedule/frontend/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location = /schedule {
    return 301 /schedule/;
}
